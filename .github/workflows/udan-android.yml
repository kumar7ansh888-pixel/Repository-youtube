# Builds the Udan Coaching Android app on GitHub's servers.
#
# Every push that touches udan-coaching/ runs the tests and produces:
#   * udan-coaching-apk            - install directly on a phone to test
#   * udan-coaching-play-store-aab - upload to Google Play Console
#                                    (only when the signing secrets are set)
# Download them from the run's "Artifacts" section on the Actions tab.
name: Udan Coaching app

on:
  push:
    paths:
      - "udan-coaching/**"
      - ".github/workflows/udan-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: udan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Payment functions tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: udan-coaching/firebase/functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  rules:
    name: Database security rules tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: udan-coaching/firebase/rules-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test

  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the test APK as a GitHub Release
    defaults:
      run:
        working-directory: udan-coaching/app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Release signing key (from repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.UDAN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UDAN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UDAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UDAN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Release key found: building a Play Store bundle too."
          else
            echo "No signing secrets: building a test APK signed with the debug key."
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Build Play Store bundle
        if: env.SIGNED == 'true'
        run: flutter build appbundle --release

      # Easiest download on a phone: Releases -> "Udan Coaching - test build"
      # -> udan-coaching.apk (no zip). Replaced on every push.
      - name: Publish test APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk udan-coaching.apk
          TAG="udan-test-build"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" udan-coaching.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Udan Coaching - test build" \
            --notes "Test APK built from commit ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.

          Install: download udan-coaching.apk on your Android phone and open it (allow installing apps from your browser).
          Demo mode until Firebase is connected: any number + OTP 123456 (student), 9999999999 (admin panel).
          This file is for testing only. Upload the signed .aab to the Play Store, not this APK."

      # Install and launch the APK on an Android emulator to prove it works.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/udan-install-check.sh udan-coaching/app/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshot
          path: udan-screen.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: udan-coaching-apk
          path: udan-coaching/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.SIGNED == 'true'
        with:
          name: udan-coaching-play-store-aab
          path: udan-coaching/app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
